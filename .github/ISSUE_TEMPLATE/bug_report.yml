name: "Beta-Fehler melden"
description: "Fehler in KrawallTV für Fire TV melden"
title: "[Beta] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Bitte keine Zugangsdaten, Passwörter, Tokens, IPTV-URLs oder personenbezogenen Daten veröffentlichen."
  - type: input
    id: version
    attributes:
      label: KrawallTV-Version
      placeholder: "0.3.0-beta.1"
    validations:
      required: true
  - type: input
    id: firetv
    attributes:
      label: Gerät und Fire OS
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: So lässt sich der Fehler nachstellen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Was passiert?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was sollte passieren?
    validations:
      required: true
  - type: checkboxes
    id: secrets
    attributes:
      label: Datenschutz
      options:
        - label: "Ich habe alle Zugangsdaten, Tokens und privaten URLs entfernt."
          required: true
