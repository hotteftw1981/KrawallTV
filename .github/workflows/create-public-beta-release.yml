name: Create Public Beta Release
on:
  push:
    paths:
      - '.github/workflows/create-public-beta-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish beta release page
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.3.0-beta.1"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists, leaving assets and metadata untouched."
            exit 0
          fi
          gh release create "$TAG" --title "KrawallTV v0.3.0-beta.1 · Fire TV Beta + Desktop Preview" \
            --notes-file RELEASE_NOTES_v0.3.0-beta.1.md --prerelease
